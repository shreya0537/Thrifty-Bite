<body>

<header class="navbar">
    <div class="brand">
        THRIFTY BITE
        <span>MEAL BUDGET</span>
    </div>

    <nav class="nav-links">
        <a href="home.html">Storefront</a>
        <a href="menu.html">Full Menu</a>
        <a href="cart.html">Cart</a>
    </nav>

    <div class="nav-right">
        <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">

    <div class="page-header">
        <h1>Meal Budget</h1>
        <p>Set the amount you want to spend and discover food choices — and full meal combos — that fit without compromising your cravings.</p>
    </div>

    <div id="message" class="message"></div>

    <div class="card">
        <form id="budgetForm" class="budget-form">
            <div class="form-group">
                <label>Your Budget (₹)</label>
                <input type="number" id="budgetInput" min="1" placeholder="e.g. 300" required>
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="vegFilter">
                    <option value="">Veg &amp; Non-Veg</option>
                    <option value="veg">Veg Only</option>
                    <option value="nonveg">Non-Veg Only</option>
                </select>
            </div>
            <button type="submit" class="btn">Find Meals</button>
        </form>
    </div>

    <div id="results"></div>

</div>

<script src="assets/api.js"></script>
<script>

const CART_KEY = "thriftyBiteCart";
const messageEl = document.getElementById("message");

const MAIN_CATEGORIES = ["Biryani", "Pizza", "Burgers", "Chinese", "Pasta", "North Indian", "South Indian", "Rolls & Wraps"];

let allDishes = [];

function getLocalCart(){
    try{
        const raw = localStorage.getItem(CART_KEY);
        const cart = raw ? JSON.parse(raw) : [];
        return Array.isArray(cart) ? cart : [];
    }catch(e){
        return [];
    }
}

function saveLocalCart(cart){
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function addDishToCart(dish){
    const cart = getLocalCart();
    const existing = cart.find(item => String(item.menuId) === String(dish._id));

    if(existing){
        existing.quantity = Number(existing.quantity || 1) + 1;
    }else{
        cart.push({
            menuId: dish._id,
            name: dish.name,
            description: dish.description || "",
            price: Number(dish.discountPrice ?? dish.price ?? 0),
            originalPrice: Number(dish.price ?? dish.discountPrice ?? 0),
            image: dish.image || "",
            quantity: 1,
            category: dish.category || "",
            isVeg: Boolean(dish.isVeg)
        });
    }

    saveLocalCart(cart);
}

function addDishToCartById(id){
    const dish = allDishes.find(d => d._id === id);
    if(dish){
        addDishToCart(dish);
        showMessage(messageEl, dish.name + " added to cart!", "success");
    }
}

window.addDishToCartById = addDishToCartById;

window.addComboToCart = function addComboToCart(index){
    const combo = window.currentCombos[index];
    if(!combo) return;
    combo.items.forEach(addDishToCart);
    showMessage(messageEl, "Combo added to cart! (" + combo.items.length + " items)", "success");
};

async function loadDishes(){
    try{
        const data = await apiFetch("/menu/all");
        allDishes = data.menu || [];
    }catch(err){
        showMessage(messageEl, err.message, "error");
    }
}

function filterByVeg(dishes, vegFilter){
    if(vegFilter === "veg") return dishes.filter(d => d.isVeg);
    if(vegFilter === "nonveg") return dishes.filter(d => !d.isVeg);
    return dishes;
}

/*
 * Greedily builds up to 3 meal combos (main + beverage + dessert)
 * that fit within budget, avoiding repeats across combos.
 *
 * The main course is capped at 65% of budget (not just "highest
 * rated affordable item") — otherwise the top-rated main is
 * usually a premium "Royal/Signature" dish that eats the whole
 * budget on its own, leaving nothing for a drink or dessert and
 * turning every "combo" into a single item.
 */
function buildCombos(dishes, budget){
    const byCategory = (cats) => dishes
        .filter(d => cats.includes(d.category))
        .slice()
        .sort((a, b) => (b.rating || 0) - (a.rating || 0) || a.discountPrice - b.discountPrice);

    const mains = byCategory(MAIN_CATEGORIES);
    const desserts = byCategory(["Desserts"]);
    const beverages = byCategory(["Beverages"]);

    const used = new Set();
    const combos = [];

    for(let i = 0; i < 3; i++){
        const mainCap = budget * 0.65;
        const main = mains.find(d => !used.has(d._id) && d.discountPrice <= mainCap)
            || mains.find(d => !used.has(d._id) && d.discountPrice <= budget);
        if(!main) break;

        const items = [main];
        let remaining = budget - main.discountPrice;
        used.add(main._id);

        const beverageCap = Math.min(remaining, budget * 0.25);
        const beverage = beverages.find(d => !used.has(d._id) && d.discountPrice <= beverageCap)
            || beverages.find(d => !used.has(d._id) && d.discountPrice <= remaining);
        if(beverage){
            items.push(beverage);
            remaining -= beverage.discountPrice;
            used.add(beverage._id);
        }

        const dessert = desserts.find(d => !used.has(d._id) && d.discountPrice <= remaining);
        if(dessert){
            items.push(dessert);
            remaining -= dessert.discountPrice;
            used.add(dessert._id);
        }

        const total = items.reduce((s, d) => s + d.discountPrice, 0);
        const fullPriceTotal = items.reduce((s, d) => s + d.price, 0);

        combos.push({ items, total, savings: fullPriceTotal - total });
    }

    return combos;
}

function dishCardHtml(dish){
    return "<div class='card dish-card'>"
        + tbFavHeart(dish._id)
        + "<img class='dish-img' src='" + escapeHtml(dish.image || "images/food-placeholder.svg") + "' onerror=\"this.src='images/food-placeholder.svg'\" alt=''>"
        + "<h3>" + escapeHtml(dish.name) + "</h3>"
        + "<p class='muted small mt-12'>" + escapeHtml(dish.category) + " &middot; ★" + (dish.rating || "-") + "</p>"
        + "<div class='flex-between mt-20'>"
            + "<strong>" + formatMoney(dish.discountPrice) + "</strong>"
            + "<button class='btn btn-sm' onclick=\"addDishToCartById('" + dish._id + "')\">Add to Cart</button>"
        + "</div>"
        + "</div>";
}

function comboCardHtml(combo, index){
    const itemsHtml = combo.items.map(d =>
        "<div class='combo-item-row'><span>" + escapeHtml(d.name) + " (" + escapeHtml(d.category) + ")</span><span>" + formatMoney(d.discountPrice) + "</span></div>"
    ).join("");

    return "<div class='card combo-card'>"
        + "<h3>Combo " + (index + 1) + "</h3>"
        + itemsHtml
        + "<div class='combo-total'>"
            + "<div><strong>Total: " + formatMoney(combo.total) + "</strong>"
                + (combo.savings > 0 ? " <span class='savings-tag'>(you save " + formatMoney(combo.savings) + ")</span>" : "")
            + "</div>"
            + "<button class='btn btn-sm' onclick='addComboToCart(" + index + ")'>Add Combo to Cart</button>"
        + "</div>"
        + "</div>";
}

function renderResults(budget, vegFilter){
    const resultsEl = document.getElementById("results");
    const affordable = filterByVeg(allDishes, vegFilter).filter(d => d.discountPrice <= budget);

    if(affordable.length === 0){
        resultsEl.innerHTML = '<div class="card"><div class="empty-state">Nothing fits that budget yet — try a higher amount.</div></div>';
        window.currentCombos = [];
        return;
    }

    const combos = buildCombos(filterByVeg(allDishes, vegFilter), budget);
    window.currentCombos = combos;

    const sortedDishes = affordable.slice().sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 24);

    let html = "";

    if(combos.length > 0){
        html += "<div class='page-header'><h2>Suggested Meal Combos</h2><p class='muted small'>Main + drink + dessert, picked to fit your budget.</p></div>";
        html += combos.map(comboCardHtml).join("");
    }

    html += "<div class='page-header mt-20'><h2>Individual Dishes Within Budget</h2><p class='muted small'>" + affordable.length + " dishes found, showing top " + sortedDishes.length + " by rating.</p></div>";
    html += "<div class='grid cols-3'>" + sortedDishes.map(dishCardHtml).join("") + "</div>";

    resultsEl.innerHTML = html;
    tbMarkFavHearts();
}

document.getElementById("budgetForm").addEventListener("submit", function(e){
    e.preventDefault();

    const budget = Number(document.getElementById("budgetInput").value);
    const vegFilter = document.getElementById("vegFilter").value;

    if(!budget || budget <= 0){
        showMessage(messageEl, "Enter a valid budget amount.", "error");
        return;
    }

    renderResults(budget, vegFilter);
});

loadDishes();

</script>
