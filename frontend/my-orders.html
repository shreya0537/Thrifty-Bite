<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thrifty Bite | My Orders</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
.container{max-width:1080px}
.page-header{padding:25px 27px;border:1px solid rgba(212,175,55,.32);border-radius:20px;background:radial-gradient(circle at 90% 10%,rgba(212,175,55,.14),transparent 35%),linear-gradient(125deg,rgba(107,20,40,.6),rgba(38,6,17,.7));}
.page-header h1{font-size:clamp(27px,4vw,38px);color:var(--gold-light)}
.page-header p{line-height:1.7}
.order-card{position:relative;overflow:hidden;border-color:rgba(212,175,55,.36);box-shadow:0 14px 35px rgba(0,0,0,.16);transition:transform .22s,border-color .22s,box-shadow .22s}
.order-card:hover{transform:translateY(-3px);border-color:rgba(247,223,122,.7);box-shadow:0 18px 40px rgba(0,0,0,.22),0 0 22px rgba(212,175,55,.08)}
.order-card h3{font-family:Cinzel,serif;color:var(--gold-light);font-size:19px}
.order-card .order-tracker{padding:18px 13px 12px;border:1px solid rgba(212,175,55,.18);border-radius:14px;background:rgba(255,248,232,.025)}
.order-card .order-tracker div{font-size:clamp(9px,1.3vw,12px)!important;line-height:1.5}
.order-card .order-tracker div div{box-shadow:0 0 12px rgba(212,175,55,.12)}
.order-card .badge{white-space:nowrap}
.order-card .muted{color:var(--muted)}
.order-card .flex-between{gap:12px;flex-wrap:wrap}
.order-card .mt-12{margin-top:14px}
.tracking-intro{color:var(--muted);font-size:13px;line-height:1.6;margin:9px 0 18px}
@media(max-width:580px){.container{padding:22px 14px 60px}.order-card{padding:17px}.order-card .order-tracker{padding:12px 7px}.order-card .order-tracker div{overflow-wrap:anywhere}}
@media(prefers-reduced-motion:reduce){.order-card{transition:none}.order-card:hover{transform:none}}
</style>
<style id="thrifty-gold-spark-css">
/* Thrifty Bite gold-spark polish — shared across all pages */
.gold-spark-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:9999;contain:strict}
.gold-spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#f7df7a;box-shadow:0 0 7px 2px rgba(247,223,122,.6);opacity:0;animation:goldSparkFloat var(--duration,5s) ease-in-out var(--delay,0s) infinite}
.gold-spark:after{content:"";position:absolute;left:1px;top:-3px;width:1px;height:9px;background:linear-gradient(transparent,#fff1ad,transparent);transform:rotate(35deg)}
@keyframes goldSparkFloat{0%{opacity:0;transform:translate3d(0,18px,0) scale(.5)}18%{opacity:.8}65%{opacity:.55}100%{opacity:0;transform:translate3d(18px,-90px,0) scale(1.25)}}
.card,.panel,.page-header,.order-card{transition:box-shadow .25s ease,border-color .25s ease,transform .25s ease}
.card:hover{box-shadow:0 0 0 1px rgba(212,175,55,.12),0 12px 30px rgba(0,0,0,.12)}
button,.btn{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
button:hover,.btn:hover{box-shadow:0 0 18px rgba(212,175,55,.12)}
@media(prefers-reduced-motion:reduce){.gold-spark{animation:none;display:none}*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
<link rel="stylesheet" href="assets/polish.css">
</head>
<body>

<header class="navbar">
    <div class="brand">
        THRIFTY BITE
        <span>MY ORDERS</span>
    </div>

    <nav class="nav-links">
        <a href="home.html">Storefront</a>
        <a href="menu.html">Menu</a>
        <a href="track-order.html">Track Order</a>
    </nav>

    <div class="nav-right">
        <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">

    <div class="page-header">
        <h1>My Orders</h1>
        <p class="tracking-intro">Follow each order milestone from confirmation to delivery. Progress reflects the latest status saved by the restaurant.</p>
    </div>

    <div id="message" class="message"></div>

    <div id="orderList">
        <div class="empty-state">Loading...</div>
    </div>

</div>

<script src="assets/api.js"></script>
<script>

const user = requireAuth(["CUSTOMER"]);

if(user){

    const messageEl = document.getElementById("message");

    async function loadOrders(){
        try{
            const data = await apiFetch("/order/my");
            const list = document.getElementById("orderList");

            if(!data.orders || data.orders.length === 0){
                list.innerHTML = '<div class="card"><div class="empty-state">No orders yet. <a href="menu.html">Browse the menu</a> to place your first order.</div></div>';
                return;
            }

            list.innerHTML = data.orders.map(function(order){
                const itemsText = order.items.map(i => i.name + " x" + i.quantity).join(", ");

                const stages = [
                    {key:"PLACED",label:"Placed"},
                    {key:"PACKED",label:"Packed"},
                    {key:"SHIPPED",label:"Shipped"},
                    {key:"OUT_FOR_DELIVERY",label:"Out for delivery"},
                    {key:"DELIVERED",label:"Delivered"}
                ];
                const status = String(order.status || "PLACED").toUpperCase();
                const stageIndex = status === "REJECTED" || status === "CANCELLED" ? -1 : status === "DELIVERED" || status === "COMPLETED" ? 4 : status === "OUT_FOR_DELIVERY" ? 3 : status === "SHIPPED" ? 2 : status === "PACKED" || status === "READY" ? 1 : status === "PREPARING" || status === "ACCEPTED" ? 1 : 0;
                const tracking = status === "REJECTED" || status === "CANCELLED" ? "<p class='muted small'>This order is no longer active. Please contact support if you need help.</p>" : "<div class='order-tracker' style='display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:16px 0 6px'>" + stages.map((stage,i)=>"<div style='text-align:center;font-size:11px;color:"+(i<=stageIndex?"#f7df7a":"#9ca3af")+"'><div style='height:7px;border-radius:99px;background:"+(i<=stageIndex?"#d4af37":"rgba(212,175,55,.18)")+";margin-bottom:7px'></div>"+stage.label+"</div>").join("")+"</div><p class='muted small'>Tracking updates when the restaurant updates your order status.</p>";

                return "<div class='card order-card' style='margin-bottom:18px'>"
                    + "<div class='flex-between'>"
                        + "<h3>" + escapeHtml(order.restaurantId ? order.restaurantId.name : "Restaurant") + "</h3>"
                        + "<span class='badge " + statusBadgeClass(order.status) + "'>" + statusLabel(order.status) + "</span>"
                    + "</div>"
                    + "<p class='muted small mt-12'>" + escapeHtml(itemsText) + "</p>"
                    + tracking
                    + "<div class='flex-between mt-12'>"
                        + "<span>" + formatMoney(order.totalAmount)
                            + (order.couponCode
                                ? " <span class='muted small'>(saved " + formatMoney(order.discountAmount) + " with " + escapeHtml(order.couponCode) + ")</span>"
                                : "")
                            + " <span class='badge " + (order.paymentStatus === "PAID" ? "success" : "") + "'>"
                                + (order.paymentStatus === "PAID"
                                    ? (String(order.razorpayPaymentId || "").startsWith("demo_") ? "Paid (demo " : "Paid online (") + escapeHtml(order.paymentMethod) + ")"
                                    : "Cash on delivery")
                            + "</span>"
                        + "</span>"
                        + "<span class='muted small'>" + formatDateTime(order.createdAt) + "</span>"
                    + "</div>"
                    + "</div>";
            }).join("");
        }catch(err){
            showMessage(messageEl, err.message, "error");
        }
    }

    loadOrders();
    // Keep customer tracking in sync with status updates saved by the admin.
    setInterval(loadOrders, 20000);

}

</script>


<script id="thrifty-gold-sparks">(function(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.createElement('div');layer.className='gold-spark-layer';layer.setAttribute('aria-hidden','true');document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(layer);const count=window.innerWidth<600?12:22;for(let i=0;i<count;i++){const s=document.createElement('i');s.className='gold-spark';s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';s.style.setProperty('--duration',(4+Math.random()*5)+'s');s.style.setProperty('--delay',(-Math.random()*8)+'s');s.style.opacity='0';layer.appendChild(s)}})})();</script>
<script src="assets/theme-preference.js"></script>

<style id="tb-universal-back-style">
#tb-universal-back{position:fixed;left:16px;bottom:16px;top:auto;z-index:10001;display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid rgba(212,175,55,.65);border-radius:999px;background:rgba(38,6,17,.94);color:#f7df7a;font:600 13px/1.2 "DM Sans",Arial,sans-serif;text-decoration:none;box-shadow:0 6px 22px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
#tb-universal-back:hover{background:#4a1024;transform:translateY(-1px)}
@media(max-width:600px){#tb-universal-back{left:10px;bottom:10px;top:auto;padding:9px 12px;font-size:12px}}
</style>
<a href="home.html" id="tb-universal-back" aria-label="Go back to previous page">← Back</a>
<script id="tb-universal-back-script">(function(){var a=document.getElementById('tb-universal-back');if(!a)return;a.addEventListener('click',function(e){e.preventDefault();try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return;}}catch(_){}location.href='home.html';});})();</script>

</body>
</html>
