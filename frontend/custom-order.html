<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thrifty Bite | Custom Chef Order</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style id="thrifty-gold-spark-css">
/* Thrifty Bite gold-spark polish — shared across all pages */
.gold-spark-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:9999;contain:strict}
.gold-spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#f7df7a;box-shadow:0 0 7px 2px rgba(247,223,122,.6);opacity:0;animation:goldSparkFloat var(--duration,5s) ease-in-out var(--delay,0s) infinite}
.gold-spark:after{content:"";position:absolute;left:1px;top:-3px;width:1px;height:9px;background:linear-gradient(transparent,#fff1ad,transparent);transform:rotate(35deg)}
@keyframes goldSparkFloat{0%{opacity:0;transform:translate3d(0,18px,0) scale(.5)}18%{opacity:.8}65%{opacity:.55}100%{opacity:0;transform:translate3d(18px,-90px,0) scale(1.25)}}
.card,.panel,.page-header,.order-card{transition:box-shadow .25s ease,border-color .25s ease,transform .25s ease}
.card:hover{box-shadow:0 0 0 1px rgba(212,175,55,.12),0 12px 30px rgba(0,0,0,.12)}
button,.btn{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
button:hover,.btn:hover{box-shadow:0 0 18px rgba(212,175,55,.12)}
@media(prefers-reduced-motion:reduce){.gold-spark{animation:none;display:none}*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
<link rel="stylesheet" href="assets/polish.css">
</head>
<body>

<header class="navbar">
    <div class="brand">
        THRIFTY BITE
        <span>ASK A CHEF</span>
    </div>

    <nav class="nav-links">
        <a href="home.html">Storefront</a>
        <a href="friends.html">Friends</a>
        <a href="group-order.html">Group Orders</a>
    </nav>

    <div class="nav-right">
        <span class="muted small" id="customerName">Customer</span>
        <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
</header>

<div class="container">

    <div class="page-header">
        <h1>Custom Order / Ask a Chef</h1>
        <p>Describe what you want made and a Master Chef will send you a price and timeline.</p>
    </div>

    <div id="message" class="message"></div>

    <div class="card">
        <h2>New Custom Request</h2>
        <form id="requestForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Food Required</label>
                    <input type="text" id="foodRequired" placeholder="e.g. Birthday Cake" required>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" placeholder="Describe what you need in detail" required></textarea>
            </div>
            <div class="form-group">
                <label>Prefer a Specific Chef (optional)</label>
                <select id="chefId">
                    <option value="">Any available chef</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" id="preferredDate" required>
                </div>
                <div class="form-group">
                    <label>Preferred Time</label>
                    <input type="time" id="preferredTime" required>
                </div>
            </div>
            <div class="form-group">
                <label>Special Instructions (optional)</label>
                <textarea id="specialInstructions" placeholder="e.g. eggless, less sugar"></textarea>
            </div>
            <div class="form-group">
                <label>Reference Image URL (optional)</label>
                <input type="text" id="referenceImage" placeholder="https://...">
            </div>
            <button type="submit" class="btn">Submit Request</button>
        </form>
    </div>

    <div class="card">
        <h2>My Custom Requests</h2>
        <div id="requestList" class="mt-20">
            <div class="empty-state">No custom requests yet.</div>
        </div>
    </div>

</div>

<script src="assets/api.js"></script>
<script>

const user = requireAuth(["CUSTOMER"]);

if(user){

    document.getElementById("customerName").textContent = user.name || user.username;

    const messageEl = document.getElementById("message");

    async function loadChefs(){
        try{
            const data = await apiFetch("/custom-orders/chefs");
            const select = document.getElementById("chefId");
            (data.chefs || []).forEach(function(chef){
                const label = chef.name + (chef.specialization ? " — " + chef.specialization : "");
                select.innerHTML += "<option value='" + chef._id + "'>" + escapeHtml(label) + "</option>";
            });
        }catch(err){
            /* non-critical — the picker just stays on "Any available chef" */
        }
    }

    document.getElementById("requestForm").addEventListener("submit", async function(e){
        e.preventDefault();

        const payload = {
            foodRequired: document.getElementById("foodRequired").value.trim(),
            description: document.getElementById("description").value.trim(),
            quantity: Number(document.getElementById("quantity").value) || 1,
            chefId: document.getElementById("chefId").value || undefined,
            preferredDate: document.getElementById("preferredDate").value,
            preferredTime: document.getElementById("preferredTime").value,
            specialInstructions: document.getElementById("specialInstructions").value.trim(),
            referenceImage: document.getElementById("referenceImage").value.trim()
        };

        try{
            await apiFetch("/custom-orders", {
                method: "POST",
                body: JSON.stringify(payload)
            });
            showMessage(messageEl, "Custom order request submitted!", "success");
            document.getElementById("requestForm").reset();
            document.getElementById("quantity").value = 1;
            loadRequests();
        }catch(err){
            showMessage(messageEl, err.message, "error");
        }
    });

    async function loadRequests(){
        try{
            const data = await apiFetch("/custom-orders/my");
            const list = document.getElementById("requestList");

            if(!data.orders || data.orders.length === 0){
                list.innerHTML = '<div class="empty-state">No custom requests yet.</div>';
                return;
            }

            list.innerHTML = data.orders.map(function(order){
                const chefName = order.chefId ? (order.chefId.name || order.chefId.username) : "Not yet assigned";

                return "<div class='card' style='margin-bottom:14px'>"
                    + "<div class='flex-between'>"
                        + "<h3>" + escapeHtml(order.foodRequired) + "</h3>"
                        + "<span class='badge " + statusBadgeClass(order.status) + "'>" + statusLabel(order.status) + "</span>"
                    + "</div>"
                    + "<p class='muted small mt-12'>Chef: " + escapeHtml(chefName) + " &middot; Preferred: " + formatDate(order.preferredDate) + " at " + escapeHtml(order.preferredTime) + "</p>"
                    + "<a class='btn btn-sm btn-outline mt-12' href='custom-order-detail.html?id=" + order._id + "'>View Details</a>"
                    + "</div>";
            }).join("");
        }catch(err){
            showMessage(messageEl, err.message, "error");
        }
    }

    loadChefs();
    loadRequests();

}

</script>


<script id="thrifty-gold-sparks">(function(){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=document.createElement('div');layer.className='gold-spark-layer';layer.setAttribute('aria-hidden','true');document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(layer);const count=window.innerWidth<600?12:22;for(let i=0;i<count;i++){const s=document.createElement('i');s.className='gold-spark';s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';s.style.setProperty('--duration',(4+Math.random()*5)+'s');s.style.setProperty('--delay',(-Math.random()*8)+'s');s.style.opacity='0';layer.appendChild(s)}})})();</script>
<script src="assets/theme-preference.js"></script>

<style id="tb-universal-back-style">
#tb-universal-back{position:fixed;left:16px;bottom:16px;top:auto;z-index:10001;display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid rgba(212,175,55,.65);border-radius:999px;background:rgba(38,6,17,.94);color:#f7df7a;font:600 13px/1.2 "DM Sans",Arial,sans-serif;text-decoration:none;box-shadow:0 6px 22px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
#tb-universal-back:hover{background:#4a1024;transform:translateY(-1px)}
@media(max-width:600px){#tb-universal-back{left:10px;bottom:10px;top:auto;padding:9px 12px;font-size:12px}}
</style>
<a href="home.html" id="tb-universal-back" aria-label="Go back to previous page">← Back</a>
<script id="tb-universal-back-script">(function(){var a=document.getElementById('tb-universal-back');if(!a)return;a.addEventListener('click',function(e){e.preventDefault();try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return;}}catch(_){}location.href='home.html';});})();</script>

</body>
</html>
